services:
  - type: web
    name: vedashri-travels
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: vedashri-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: vedashri-db
          property: connectionString
databases:
  - name: vedashri-db
    plan: free
